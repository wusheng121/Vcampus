# ============================================================
#  Vcampus 配置模板 —— 复制为 config.properties 并填入真实值
#  config.properties 已被 .gitignore 忽略，不会提交。
# ============================================================

# --- 数据库 (MySQL 8.x) ---
# 注意：vcampus 数据库需先用 src/vcampus.sql 初始化
db.url=jdbc:mysql://localhost:3306/vcampus?useSSL=false&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.user=root
db.password=你的MySQL密码

# --- AI 助理 (DeepSeek) ---
# 申请地址: https://platform.deepseek.com/
# 留空则 AI 助理功能不可用（不影响其他模块）
deepseek.api.key=你的 DeepSeek API Key
deepseek.model=deepseek-chat
deepseek.base-url=https://api.deepseek.com/chat/completions

# --- Socket 服务 ---
server.host=127.0.0.1
server.port=8888

# --- 邮件 (找回密码发验证码) ---
# QQ 邮箱：开启 SMTP 服务后生成"授权码"（非登录密码）填到 mail.password
mail.smtp.host=smtp.qq.com
mail.smtp.port=465
mail.smtp.ssl=true
mail.username=你的QQ邮箱@qq.com
mail.password=QQ邮箱授权码
mail.from=你的QQ邮箱@qq.com
mail.from-name=虚拟校园
mail.verify-code.ttl-minutes=10
